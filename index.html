<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Form & Found is an independent architecture and interior design studio." />
    <meta name="theme-color" content="#F2EFE9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..500&family=Manrope:wght@300..700&display=swap" rel="stylesheet" />
    <title>Form & Found — Architecture and Interiors</title>
    <script>
      // Motion preference: ?motion=full|calm (passed from the portfolio) wins and is remembered;
      // otherwise follow the system's "reduce motion" setting. Calm keeps hovers and fades only.
      try {
        var q = new URLSearchParams(location.search).get('motion')
        if (q === 'full' || q === 'calm') localStorage.setItem('motion-pref', q)
        var p = localStorage.getItem('motion-pref')
        if (p !== 'full' && p !== 'calm') p = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'calm' : 'full'
        document.documentElement.dataset.motion = p
      } catch (e) {
        document.documentElement.dataset.motion = 'full'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
